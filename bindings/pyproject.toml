[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "redstone-sim"
version = "0.4.0"
description = "Python bindings for mcredstone-cuda, a GPU-accelerated Minecraft redstone simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# `redstone_sim.env` wraps the simulator as a Gymnasium environment. It is
# imported lazily, so the core package works without this installed.
env = ["gymnasium>=0.29"]

[project.urls]
Homepage = "https://github.com/udphix/mcredstone-cuda"

[tool.setuptools]
packages = ["redstone_sim"]

# NOTE: this package does not ship the native library. `_core.py` loads
# `build/Release/redstone_sim.dll` (or the Linux equivalent) relative to the
# repository root, so build the CMake project first:
#
#     cmake -B build -DCMAKE_CUDA_ARCHITECTURES=86
#     cmake --build build --config Release --target redstone_sim
#     pip install -e bindings
#
# Installing non-editable would leave the package unable to find the library
# unless you point $REDSTONE_SIM_DLL at it explicitly.
